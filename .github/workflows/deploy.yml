
  # Workflow name
  name: Spring Boot CI/CD

  # Workflow triggers
  on:
    push:
      branches:
        - main

    workflow_dispatch:

  # Environment variables
  env:
    IMAGE_NAME: spring-boot-app

  jobs:
    build-deploy:
      runs-on: ubuntu-latest

      steps:

        # STEP 1: Checkout source code
        - name: Checkout Source
          uses: actions/checkout@v4

        # STEP 2: Setup Java 21
        - name: Setup Java
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '21'
            cache: maven

        # STEP 3: Build Spring Boot project
        - name: Build Project
          run: mvn clean package

        # STEP 4: Login to Docker Hub
        - name: Login Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        # STEP 5: Build Docker image
        - name: Build Docker Image
          run: |
            docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

        # STEP 6: Push image to Docker Hub
        - name: Push Image
          run: |
            docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

        # STEP 7: Validate EC2 SSH private key
        - name: Validate EC2 SSH Key
          shell: bash
          env:
            SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          run: |
            set -e
            mkdir -p ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ec2_key
            chmod 600 ~/.ssh/ec2_key
            
            ssh-keygen -y -f ~/.ssh/ec2_key > ~/.ssh/ec2_key.pub
            
            echo "SSH private key format is valid."
            ssh-keygen -lf ~/.ssh/ec2_key.pub

        # STEP 8: Deploy application to EC2
        - name: Deploy to EC2
          uses: appleboy/ssh-action@v1.2.0
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_SSH_KEY }}
            port: 22

            script: |
              set -e
              
              # Pull latest Docker image
              sudo docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
              
              # Stop existing container
              sudo docker stop spring-boot-container || true
              
              # Remove existing container
              sudo docker rm spring-boot-container || true
              
              # Start new container
              sudo docker run -d \
                --name spring-boot-container \
                --restart unless-stopped \
                -p 8081:8081 \
                ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
              
              # Verify running container
              sudo docker ps
    
