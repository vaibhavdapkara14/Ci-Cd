
  # Workflow ka naam jo GitHub Actions tab mein show hoga
  name: Spring Boot CI/CD

  # Workflow kab execute hoga?
  on:
    # Jab bhi main branch par code push hoga
    push:
      branches:
        - main

    # GitHub Actions se manually bhi workflow run kar sakte hain
    workflow_dispatch:

  # Environment variables
  env:
    # Docker image ka base name
    IMAGE_NAME: spring-boot-app

  jobs:

    # Main job: Build, Test, Dockerize and Deploy
    build-deploy:

      # GitHub ka Ubuntu virtual machine use hoga
      runs-on: ubuntu-latest

      steps:

        # STEP 1: GitHub repository ka source code runner par download karna
        - name: Checkout Source
          uses: actions/checkout@v4

        # STEP 2: Java 21 setup karna
        # Spring Boot application Java 21 use karti hai
        - name: Setup Java
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '21'
            cache: maven

        # STEP 3: Maven se project build karna
        # Clean purane build files remove karta hai
        # Package JAR file generate karta hai
        - name: Build Project
          run: mvn clean package

        # STEP 4: Docker Hub mein login karna
        # Credentials GitHub Secrets se milenge
        # Password ki jagah Docker Hub Access Token use hoga
        - name: Login Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        # STEP 5: Docker image build karna
        # Dockerfile ke instructions execute honge
        # Image ko Docker Hub username ke saath tag kiya jayega
        - name: Build Docker Image
          run: |
            docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

        # STEP 6: Docker image ko Docker Hub par push karna
        # AWS EC2 baad mein isi image ko pull karega
        - name: Push Image
          run: |
            docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

        # STEP 7: SSH ke through AWS EC2 se connect karna
        - name: Deploy to EC2
          uses: appleboy/ssh-action@v1.2.0
          with:
            # EC2 instance ka public IP address
            host: ${{ secrets.EC2_HOST }}

            # EC2 Ubuntu username
            username: ${{ secrets.EC2_USER }}

            # EC2 private SSH key
            key: ${{ secrets.EC2_SSH_KEY }}

            # Ye commands EC2 server par execute hongi
            script: |
              
              # STEP 7.1: Docker Hub se latest image download karna
              sudo docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
              
              # STEP 7.2: Existing container stop karna
              # Container nahi mila toh bhi deployment continue hoga
              sudo docker stop spring-boot-container || true
              
              # STEP 7.3: Existing container remove karna
              sudo docker rm spring-boot-container || true
              
              # STEP 7.4: New container create aur start karna
              sudo docker run -d \
                --name spring-boot-container \
                --restart unless-stopped \
                -p 8081:8081 \
                ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
              
              # STEP 7.5: Unused Docker images clean karna
              sudo docker image prune -f
              
              # STEP 7.6: Running containers verify karna
              sudo docker ps 
  
