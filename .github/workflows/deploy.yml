
  # Workflow name
  name: Spring Boot CI/CD

  # Workflow triggers
  on:
    push:
      branches:
        - main

    workflow_dispatch:

  # Environment variables
  env:
    IMAGE_NAME: spring-boot-app

  jobs:
    build-deploy:
      runs-on: ubuntu-latest

      steps:

        # STEP 1: Checkout source code
        - name: Checkout Source
          uses: actions/checkout@v4

        # STEP 2: Setup Java 21
        - name: Setup Java
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '21'
            cache: maven

        # STEP 3: Build Spring Boot project
        - name: Build Project
          run: mvn clean package

        # STEP 4: Login to Docker Hub
        - name: Login Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        # STEP 5: Build Docker image
        - name: Build Docker Image
          run: |
            docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

        # STEP 6: Push image to Docker Hub
        - name: Push Image
          run: |
            docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

        # STEP 7: Validate EC2 SSH private key
        - name: Validate EC2 SSH Key
          shell: bash
          env:
            SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          run: |
            set -e
            mkdir -p ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ec2_key
            chmod 600 ~/.ssh/ec2_key
            
            ssh-keygen -y -f ~/.ssh/ec2_key > ~/.ssh/ec2_key.pub
            
            echo "SSH private key format is valid."
            ssh-keygen -lf ~/.ssh/ec2_key.pub

              # STEP 8: Deploy application to EC2 using native SSH
        - name: Deploy to EC2
          shell: bash
          env:
            EC2_HOST: ${{ secrets.EC2_HOST }}
            EC2_USER: ${{ secrets.EC2_USER }}
            SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
            DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          run: |
            set -euo pipefail
            
            mkdir -p ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ec2_key
            chmod 600 ~/.ssh/ec2_key
            
            # Add EC2 host key
            ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
            
            SSH_OPTS=(
              -i ~/.ssh/ec2_key
              -o IdentitiesOnly=yes
              -o BatchMode=yes
              -o ConnectTimeout=30
            )
            
            echo "Testing SSH connection..."
            
            ssh "${SSH_OPTS[@]}" "$EC2_USER@$EC2_HOST" \
              "whoami && hostname"
            
            echo "Deploying application..."
            
            ssh "${SSH_OPTS[@]}" "$EC2_USER@$EC2_HOST" \
              "set -e;
               sudo docker pull $DOCKER_USERNAME/$IMAGE_NAME:latest;
               sudo docker stop spring-boot-container 2>/dev/null || true;
               sudo docker rm spring-boot-container 2>/dev/null || true;
               sudo docker run -d \
                 --name spring-boot-container \
                 --restart unless-stopped \
                 -p 8081:8081 \
                 $DOCKER_USERNAME/$IMAGE_NAME:latest;
               sudo docker ps --filter name=spring-boot-container"
            
            echo "Deployment completed!"
